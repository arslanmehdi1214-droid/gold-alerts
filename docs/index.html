<!doctype html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:wght@500;600;700&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--ui:'IBM Plex Sans';--num:'IBM Plex Mono';--serif:'Playfair Display';--cols:6}
:root,:root[data-theme="night"]{
  --bg:#060a13; --bg2:#0a1020; --panel:#0b1222; --panel2:#101a30; --line:rgba(190,205,255,.09); --line2:rgba(190,205,255,.16);
  --ink:#eceff7; --mute:#a9b2c8; --dim:#65718d; --gold:#d4af5f; --gold2:#f2d58c; --goldsoft:rgba(212,175,95,.12);
  --buy:#0ecb81; --sell:#f6465d; --wait:#65718d; --hl:rgba(212,175,95,.05); --onink:#060a13;
  --heroGlow:radial-gradient(700px 260px at 0% 0%,rgba(212,175,95,.10),transparent 70%);
}
:root[data-theme="ivory"]{
  --bg:#f1ede1; --bg2:#ebe5d4; --panel:#fffdf6; --panel2:#f5f0e1; --line:rgba(15,26,51,.12); --line2:rgba(15,26,51,.22);
  --ink:#0f1a33; --mute:#3d4864; --dim:#7b8399; --gold:#98720f; --gold2:#b98d22; --goldsoft:rgba(152,114,15,.10);
  --buy:#0a8a58; --sell:#c42d3c; --wait:#7b8399; --hl:rgba(152,114,15,.06); --onink:#fffdf6;
  --heroGlow:radial-gradient(700px 260px at 0% 0%,rgba(152,114,15,.12),transparent 70%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--ui),system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}
body{min-height:100vh;transition:background .5s,color .5s}
.num{font-family:var(--num),ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.serif{font-family:var(--serif),Georgia,serif}
.wrap{max-width:1380px;margin:0 auto;padding:18px 24px 56px}
.pos{color:var(--buy)}.neg{color:var(--sell)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;position:relative;transition:background .5s,border-color .3s}
.cap{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.cap.g{color:var(--gold)}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 16px}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:34px;height:34px;border:1px solid var(--gold);border-radius:4px;display:grid;place-items:center;color:var(--gold);background:var(--goldsoft)}
.mark svg{width:18px;height:18px}
.brand .w{font-family:var(--serif),serif;font-size:23px;font-weight:600;letter-spacing:.01em;line-height:1}
.brand .s{font-size:10px;letter-spacing:.2em;color:var(--dim);font-weight:600;margin-top:5px}
.right{display:flex;align-items:center;gap:16px}
.live{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--buy);position:relative}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--buy);opacity:0;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.seg{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--dim);font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--gold);color:var(--onink)}
/* clocks */
.clocks{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:12px;overflow:hidden}
.clk{display:flex;align-items:center;gap:12px;padding:12px 16px;border-right:1px solid var(--line);position:relative}
.clk:last-child{border-right:0}
.clk.home{background:var(--goldsoft)}
.clk.home::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--gold)}
.clk svg{width:44px;height:44px;flex:none}
.clk .face{fill:none;stroke:var(--line2);stroke-width:1.4}
.clk.open .face{stroke:var(--buy);stroke-opacity:.7}
.tick{stroke:var(--dim);stroke-width:1.3;stroke-linecap:round;opacity:.7}
.hh,.mh{stroke:var(--ink);stroke-linecap:round}.hh{stroke-width:3.2}.mh{stroke-width:2.2}
.sh{stroke:var(--gold);stroke-width:1.2;stroke-linecap:round}.capd{fill:var(--gold)}
.ct .city{font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.ct .t{font-size:21px;font-weight:500;line-height:1.15;margin:1px 0 2px}
.ct .t small{font-size:11px;color:var(--dim);margin-left:3px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ct .s{font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
.ct .s i{width:5px;height:5px;border-radius:50%;background:var(--wait);display:inline-block}
.open .ct .s{color:var(--buy)}.open .ct .s i{background:var(--buy);box-shadow:0 0 0 3px color-mix(in srgb,var(--buy) 25%,transparent)}
/* summary row */
.sum{display:grid;grid-template-columns:1.7fr .8fr 1.1fr;gap:12px;margin-bottom:12px}
.hero{padding:20px 24px;background:var(--panel);background-image:var(--heroGlow);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold)}
.big{font-family:var(--serif),serif;font-weight:600;font-size:62px;line-height:1;margin:12px 0 6px;letter-spacing:-.01em;font-variant-numeric:lining-nums tabular-nums}
.big small{font-family:var(--ui);font-size:13px;color:var(--dim);font-weight:600;letter-spacing:.14em;margin-left:10px}
.sub{font-size:12.5px;color:var(--mute);font-weight:500}.sub b{color:var(--ink);font-weight:600}
.kp{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.kp div{white-space:nowrap;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.kp b{display:block;font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:600;margin-top:4px}
.pbm{display:flex;flex-direction:column;justify-content:center;gap:10px}
.pr{display:grid;grid-template-columns:72px 1fr 58px;align-items:center;gap:10px;font-size:12px;font-weight:600}
.pr .bar{height:5px;background:color-mix(in srgb,var(--ink) 8%,transparent);position:relative;border-radius:1px}
.pr .bar i{position:absolute;left:0;top:0;bottom:0;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.pr .v{text-align:right;font-variant-numeric:tabular-nums}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.acct{display:grid;grid-template-rows:1fr 1fr}
.acct>div{padding:16px 20px;display:flex;flex-direction:column;justify-content:center}
.acct>div+div{border-top:1px solid var(--line)}
.acct .v{font-size:30px;font-weight:500;margin-top:6px;line-height:1}
.acct .v small{font-size:11px;color:var(--dim);margin-left:6px;font-weight:600;letter-spacing:.1em}
.last{padding:18px 22px;display:flex;flex-direction:column}
.last .tm{display:flex;align-items:baseline;gap:12px;margin-top:10px}
.last .tm .v{font-family:var(--serif),serif;font-weight:600;font-size:38px;line-height:1;font-variant-numeric:lining-nums}
.last .tm .v small{font-family:var(--ui);font-size:13px;color:var(--dim);margin-left:3px;font-weight:600;text-transform:uppercase}
.ago{font-size:11px;font-weight:700;color:var(--gold);background:var(--goldsoft);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);padding:3px 9px;border-radius:3px;letter-spacing:.03em}
.lw{font-size:13px;color:var(--mute);margin-top:12px;font-weight:500;display:flex;align-items:center;gap:8px}.lw b{color:var(--ink);font-weight:600}
.lc{display:flex;gap:16px;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);font-weight:500}.lc b{color:var(--ink);font-weight:600}
.sd{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.06em}
.sd.buy{background:color-mix(in srgb,var(--buy) 16%,transparent);color:var(--buy)}
.sd.sell{background:color-mix(in srgb,var(--sell) 16%,transparent);color:var(--sell)}
.sd.waiting{background:color-mix(in srgb,var(--wait) 18%,transparent);color:var(--wait)}
/* main layout */
.main{display:grid;grid-template-columns:1fr 340px;gap:12px;align-items:start}
.ph{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.ph h2{font-family:var(--serif),serif;font-size:19px;font-weight:600;letter-spacing:.01em}
.ph span{font-size:11.5px;color:var(--dim);font-weight:500}
.stack{display:flex;flex-direction:column;gap:12px}
/* tables */
.th,.tr{display:grid;align-items:center;gap:12px;padding:0 18px}
.th{height:30px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.tr{min-height:54px;border-bottom:1px solid var(--line);transition:background .2s;position:relative}
.tr:last-child{border-bottom:0}
.tr:hover{background:var(--hl)}
.mk{grid-template-columns:1.5fr .7fr 1.1fr .9fr 130px 1.2fr}
.mk .nm{font-weight:600;font-size:13.5px}.mk .sy{font-size:11px;color:var(--dim);margin-top:2px}
.mk .p{font-size:15.5px;font-weight:600}
.mk .ch{font-size:12px;font-weight:600}
.mk .tg{font-size:11.5px;color:var(--mute);text-align:right;font-weight:500}
.mk .tg b{display:block;font-size:12.5px;font-weight:600}
.tr .bar3{position:absolute;left:0;top:10px;bottom:10px;width:2px;background:var(--wait);opacity:.5}
.tr.s-buy .bar3{background:var(--buy);opacity:1}.tr.s-sell .bar3{background:var(--sell);opacity:1}
.spk svg{display:block}
.flash-up{animation:fu .9s}.flash-dn{animation:fd .9s}
@keyframes fu{0%{color:var(--buy);text-shadow:0 0 14px var(--buy)}100%{}}
@keyframes fd{0%{color:var(--sell);text-shadow:0 0 14px var(--sell)}100%{}}
.ps{grid-template-columns:1.5fr .6fr .9fr .9fr .9fr 1.25fr .9fr}
.ps .nm{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
.ps .nm small{display:block;font-size:11px;color:var(--dim);font-weight:500;margin-top:2px}
.ps .c{font-size:12.5px;font-weight:500}
.ps .pl{text-align:right;font-size:15px;font-weight:600}
.rb{position:relative;height:5px;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:1px;margin-top:7px}
.rb .e{position:absolute;left:25%;top:-3px;bottom:-3px;width:1px;background:var(--dim)}
.rb .f{position:absolute;top:0;bottom:0;left:0;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
.rl{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.rl svg{width:12px;height:12px}
/* feed */
.fe{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--line);font-size:12.5px}
.fe:last-child{border-bottom:0}
.fe .tm{color:var(--dim);font-weight:600;font-size:11.5px}
.fe b{font-weight:600}
.fe small{display:block;color:var(--dim);font-size:11px;margin-top:2px}
.fe .am{font-weight:600;font-variant-numeric:tabular-nums}
.fi{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
.feedbox{max-height:760px;overflow:auto}
.feedbox::-webkit-scrollbar{width:6px}.feedbox::-webkit-scrollbar-thumb{background:var(--line2)}
.rise{opacity:0;transform:translateY(10px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{to{opacity:1;transform:none}}
.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.5s .2s cubic-bezier(.3,.7,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media(max-width:1150px){.main{grid-template-columns:1fr}.sum{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.clocks{grid-template-columns:repeat(3,1fr)}.clk{border-bottom:1px solid var(--line)}}
@media(max-width:720px){.wrap{padding:12px}.mk{grid-template-columns:1.4fr 1fr 1fr}.mk .sg,.mk .spk,.mk .tg{display:none}.ps{grid-template-columns:1.4fr 1fr 1fr}.ps .c:nth-of-type(n+2),.ps .rbc{display:none}.th{display:none}.big{font-size:56px}}

.lnk{color:var(--mute);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:7px 4px;border-bottom:1px solid transparent;transition:.2s}.lnk:hover{color:var(--gold);border-color:var(--gold)}
.an-h{flex-wrap:wrap;gap:12px;align-items:center}
.an-ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl2{display:flex;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.pl2 button{border:0;background:transparent;color:var(--dim);font:600 11.5px var(--ui);padding:7px 12px;cursor:pointer;transition:.2s;border-right:1px solid var(--line)}
.pl2 button:last-child{border-right:0}.pl2 button.on{background:var(--goldsoft);color:var(--gold)}
.pl2 button:hover{color:var(--ink)}
.sel{background:var(--panel2);color:var(--ink);border:1px solid var(--line2);border-radius:5px;font:600 11.5px var(--ui);padding:7px 10px}
.kpis{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1.2fr;border-bottom:1px solid var(--line)}
.kc{padding:16px 20px;border-right:1px solid var(--line);min-width:0}.kc:last-child{border-right:0}
.kc .v{font-size:25px;font-weight:500;margin-top:7px;line-height:1.1}
.kc .v.sm{font-size:19px}
.kc .d{font-size:11.5px;color:var(--dim);margin-top:5px;font-weight:500}
.kc .dn{display:flex;align-items:center;gap:12px}.kc .dn svg{width:50px;height:50px;flex:none}
.dn .bgc{fill:none;stroke:color-mix(in srgb,var(--ink) 10%,transparent);stroke-width:7}.dn .fgc{fill:none;stroke:var(--buy);stroke-width:7;stroke-linecap:butt;stroke-dasharray:var(--a) 200;transform:rotate(-90deg);transform-origin:50% 50%;animation:donut 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes donut{from{stroke-dasharray:0 200}}
.an-g{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.an-g>div{padding:16px 20px;min-width:0}.an-g>div+div{border-left:1px solid var(--line)}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sec .lg{display:flex;gap:14px;letter-spacing:.04em;text-transform:none;font-weight:500;font-size:11px}.sec .lg i{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:1px}
.pcw{position:relative}.pcw svg{display:block;width:100%}
.pcw .gl line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.pcw .eq{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pcw .zr{stroke:var(--dim);stroke-dasharray:3 4;opacity:.6;vector-effect:non-scaling-stroke}
.pcw .yl{position:absolute;left:4px;font-size:10px;color:var(--dim);font-family:var(--num);transform:translateY(-50%)}
.pcw .cur{position:absolute;top:0;bottom:0;width:1px;background:var(--gold);opacity:0;pointer-events:none}
.pcw .tip{position:absolute;top:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:6px 9px;font-size:11.5px;white-space:nowrap;opacity:0;pointer-events:none;z-index:3}
.pcw:hover .cur,.pcw:hover .tip{opacity:1}
.pcw .tip b{display:block;font-size:13px;margin-top:2px}
.pcw rect.bp{fill:var(--buy)}.pcw rect.bn{fill:var(--sell)}.pcw rect:hover{opacity:.75}
.axx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:5px}
.dk{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dk div{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}.dk b{display:block;font-size:14px;letter-spacing:0;text-transform:none;margin-top:4px}
.mr{display:grid;grid-template-columns:76px 36px 1fr 66px;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mr:last-child{border-bottom:0}.mr .bar{height:5px;background:color-mix(in srgb,var(--ink) 8%,transparent);position:relative}.mr .bar i{position:absolute;top:0;bottom:0;left:0}
.mr .n{color:var(--dim);font-size:11.5px;text-align:right}.mr .v{text-align:right;font-weight:600}
.tp{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}.tp:last-child{border-bottom:0}
.tp small{display:block;color:var(--dim);font-size:11px;margin-top:2px}.tp .v{font-weight:600;align-self:center}
.tgl{display:flex;gap:2px}.tgl button{border:0;background:transparent;color:var(--dim);font:600 10.5px var(--ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;cursor:pointer;border-radius:3px}.tgl button.on{background:var(--goldsoft);color:var(--gold)}
.tx{display:grid;grid-template-columns:100px 80px 1.3fr 1fr 1fr;gap:12px;align-items:center;padding:0 20px;min-height:40px;border-bottom:1px solid var(--line);font-size:12.5px}
.tx.hd{min-height:30px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tx .r{text-align:right}.tx:not(.hd):hover{background:var(--hl)}
.more{margin:14px 20px;border:1px solid var(--line2);background:transparent;color:var(--mute);font:600 11.5px var(--ui);padding:8px 14px;border-radius:5px;cursor:pointer}
.note{padding:12px 20px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);line-height:1.5}
.empty{padding:34px 20px;color:var(--dim);text-align:center}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}.an-g{grid-template-columns:1fr}.an-g>div+div{border-left:0;border-top:1px solid var(--line)}}
@media(max-width:720px){.tx{grid-template-columns:70px 1fr 1fr}.tx>:nth-child(2),.tx>:nth-child(4){display:none}.dk{grid-template-columns:repeat(2,1fr)}}

:root[data-theme="blackgold"]{--bg:#070708;--bg2:#0c0c0e;--panel:#111114;--panel2:#18181c;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--ink:#eeeeea;--mute:#b4b3ac;--dim:#6f6e68;--gold:#cfa84a;--gold2:#f0cf7a;--goldsoft:rgba(207,168,74,.12);--buy:#0ecb81;--sell:#f6465d;--wait:#6f6e68;--hl:rgba(207,168,74,.05);--onink:#070708;--heroGlow:radial-gradient(700px 260px at 0% 0%,rgba(207,168,74,.12),transparent 70%)}
:root[data-theme="emerald"]{--bg:#04100d;--bg2:#08170f;--panel:#0a1d18;--panel2:#10281f;--line:rgba(140,235,200,.09);--line2:rgba(140,235,200,.17);--ink:#e9fbf4;--mute:#a6cbbf;--dim:#628379;--gold:#d8b45a;--gold2:#f1d78b;--goldsoft:rgba(216,180,90,.12);--buy:#2be3a0;--sell:#ff6b73;--wait:#628379;--hl:rgba(216,180,90,.05);--onink:#04100d;--heroGlow:radial-gradient(700px 260px at 0% 0%,rgba(43,227,160,.10),transparent 70%)}
:root[data-theme="graphite"]{--bg:#0d0e11;--bg2:#121317;--panel:#16181d;--panel2:#1e2027;--line:rgba(220,228,255,.08);--line2:rgba(220,228,255,.16);--ink:#eef0f5;--mute:#b3b8c6;--dim:#6c7385;--gold:#c9cfdc;--gold2:#e8ecf5;--goldsoft:rgba(201,207,220,.11);--buy:#3ddc97;--sell:#ff5d6c;--wait:#6c7385;--hl:rgba(201,207,220,.05);--onink:#0d0e11;--heroGlow:radial-gradient(700px 260px at 0% 0%,rgba(201,207,220,.08),transparent 70%)}

    <div class="sec">Your markets</div>${mk.map(([k,o])=>`<div class="mr"><b>${k}</b><span class="n">${o.n}</span><div class="bar"><i style="width:${Math.max(4,Math.abs(o.pl)/mx*100)}%;background:${o.pl>=0?'var(--buy)':'var(--sell)'}"></i></div><span class="v num ${o.pl>=0?'pos':'neg'}">${aed(o.pl)}</span></div>`).join('')}
    <div class="sec" style="margin-top:22px">Top deals <span class="tgl"><button data-top="profit" class="${AN.top==='profit'?'on':''}">Profit</button><button data-top="loss" class="${AN.top==='loss'?'on':''}">Loss</button></span></div>
    ${top.map(r=>`<div class="tp"><span><b>${r.name}</b><small>${dlab(r.day)} · ${tdub(r.t)}</small></span><span class="v num ${r.aed>=0?'pos':'neg'}">${aed(r.aed)}</span></div>`).join('')}</div></div>`+src;
  bindChart(ch);
  box.querySelectorAll('[data-top]').forEach(b=>b.onclick=()=>{AN.top=b.dataset.top;renderAn()});
}
renderAn();
async function loadHist(){try{const h=await fetch('https://arslanmehdi1214-droid.github.io/gold-alerts/demo_hist.json',{cache:'no-store'}).then(r=>r.json());if(h&&h.tx&&h.tx.length&&h.tx.length!==DH.tx.length){DH.tx=h.tx;renderAn()}}catch(e){}}
setInterval(loadHist,120000);loadHist();
</script>
