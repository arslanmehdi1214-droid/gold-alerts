<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Signal Desk">
<title>Signal Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0d;--bg2:#111114;--card:#16161a;--card2:#1c1c21;--line:#26262c;--line2:#32323a;
  --ink:#f4f1ea;--mute:#8e8b85;--faint:#5d5b57;
  --gold:#d4b36a;--gold2:#f1d99b;--golddim:rgba(212,179,106,.14);
  --buy:#35c47f;--buydim:rgba(53,196,127,.13);--sell:#ff6464;--selldim:rgba(255,100,100,.13);
  --amber:#e8a93a;--amberdim:rgba(232,169,58,.13);--grey:#7d7a74;--greydim:rgba(125,122,116,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(212,179,106,.10),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(212,179,106,.05),transparent 60%),var(--bg);min-height:100vh}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#8a6a2b);box-shadow:0 6px 20px rgba(212,179,106,.25);display:grid;place-items:center}
.mark:after{content:"";width:11px;height:11px;transform:rotate(45deg);background:#0b0b0d;border-radius:2px}
.brand h1{font:600 19px/1 "Playfair Display",serif;letter-spacing:.2px}
.brand small{display:block;color:var(--mute);font:500 11px/1.2 Inter;letter-spacing:1.4px;text-transform:uppercase;margin-top:4px}
.live{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--buy);box-shadow:0 0 0 0 rgba(53,196,127,.6);animation:p 2s infinite;flex:none}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(53,196,127,.55)}70%{box-shadow:0 0 0 9px rgba(53,196,127,0)}100%{box-shadow:0 0 0 0 rgba(53,196,127,0)}}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:16px}@media(min-width:760px){.chips{grid-template-columns:repeat(5,minmax(0,1fr))}}
.chips .chip{flex-direction:column;align-items:flex-start;gap:3px;padding:8px 10px;border-radius:12px;min-width:0}.chips .chip b{font-size:13px;line-height:1.2;text-align:left}.chips .chip i{font-size:9px;padding:1px 6px;white-space:nowrap}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);font:500 13px Inter;cursor:pointer;transition:.2s}
.chip b{color:var(--ink);font-weight:600}.chip i{font-style:normal;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--greydim);color:var(--grey)}
.chip.on{border-color:rgba(212,179,106,.55);background:linear-gradient(180deg,rgba(212,179,106,.14),rgba(212,179,106,.04))}
.chip i.lv{background:var(--buydim);color:var(--buy)}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.hero{position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;background:linear-gradient(135deg,rgba(212,179,106,.45),transparent 40%,transparent 70%,rgba(212,179,106,.2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.mname{font:600 30px/1.1 "Playfair Display",serif}.msym{color:var(--mute);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-top:6px}
.px{text-align:right}.px .v{font:600 30px/1.1 Inter;letter-spacing:-.5px}.px .c{font-size:13px;margin-top:6px}
.up{color:var(--buy)}.dn{color:var(--sell)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font:700 13px Inter;letter-spacing:1.2px;text-transform:uppercase;margin-top:18px}
.pill:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-buy{background:var(--buydim);color:var(--buy)}.s-sell{background:var(--selldim);color:var(--sell)}.s-waiting{background:var(--amberdim);color:var(--amber)}
.s-blocked,.s-none,.s-closed{background:var(--greydim);color:var(--grey)}
.msg{color:var(--mute);margin-top:10px;font-size:14px}
.spark{margin:18px -4px 4px;height:120px}.spark svg{width:100%;height:100%;display:block}
.sparkax{display:flex;justify-content:space-between;color:var(--faint);font-size:11px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;color:var(--mute);font-size:11px;letter-spacing:.6px;text-transform:uppercase}.kpi b{display:block;font:600 18px Inter;margin-top:4px}
.sec{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin:30px 2px 12px}
.sec h2{font:600 20px/1.2 "Playfair Display",serif}.sec span{color:var(--mute);font-size:12px;line-height:1.45}
@media(max-width:620px){.sec{flex-direction:column;align-items:flex-start}}
.ents{display:grid;gap:8px}
.row2{display:grid;grid-template-columns:44px 1.3fr 1fr 1fr 1fr 124px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.row2 em{font-style:normal;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:700 12px Inter}
.row2.BUY em{background:var(--buydim);color:var(--buy)}.row2.SELL em{background:var(--selldim);color:var(--sell)}
.row2 .c1 b{display:block;font-weight:700}.row2 .c1 small,.row2 .cx span{color:var(--mute);font-size:11px}
.row2 .cx span{display:block;letter-spacing:.4px;text-transform:uppercase;font-size:10px;color:var(--faint)}.row2 .cx b{font:600 13.5px Inter}
.more{justify-self:center;margin-top:4px}.row2>.st{justify-self:end}
@media(max-width:620px){.row2{grid-template-columns:1fr 1fr 1fr;row-gap:10px}.row2 em{display:none}.row2 .c1{grid-column:1/3}.row2 .st{grid-column:3;grid-row:1;justify-self:end}.row2 .cx{grid-row:2}}
.ent{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.erow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.eside{display:flex;align-items:center;gap:10px;font-weight:700}.eside em{font-style:normal;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:12px}
.BUY em{background:var(--buydim);color:var(--buy)}.SELL em{background:var(--selldim);color:var(--sell)}
.eside small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.st{font:600 11px Inter;letter-spacing:.8px;text-transform:uppercase;padding:5px 10px;border-radius:99px;white-space:nowrap}
.st-open{background:var(--amberdim);color:var(--amber)}.st-breakeven{background:var(--golddim);color:var(--gold2)}.st-target{background:var(--buydim);color:var(--buy)}
.st-stopped{background:var(--selldim);color:var(--sell)}.st-eod{background:var(--greydim);color:var(--ink)}.st-scratch{background:var(--greydim);color:var(--ink)}.st-close_now{background:var(--sell);color:#0b0b0d}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.lv span{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase}.lv b{font:600 14px Inter}
.empty{color:var(--mute);text-align:center;padding:26px 10px;border:1px dashed var(--line2);border-radius:18px}
.hist{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:4px 2px 2px}
.day{flex:1 0 46px;text-align:center}.bar{height:54px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font:600 13px Inter}
.day small{display:block;color:var(--faint);font-size:10.5px;margin-top:6px;white-space:nowrap}
.b-buy{background:var(--buydim);color:var(--buy);border-color:rgba(53,196,127,.3)}.b-sell{background:var(--selldim);color:var(--sell);border-color:rgba(255,100,100,.3)}
.b-none,.b-blocked,.b-waiting,.b-closed{background:var(--bg2);color:var(--faint)}
.bt{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bt div{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.bt b{display:block;font:600 22px/1.2 "Playfair Display",serif;color:var(--gold2);margin-bottom:4px}.bt span{display:block;color:var(--mute);font-size:12px;line-height:1.4}
.info{padding:26px 20px}.info .pill{margin-top:14px}.info p{color:var(--mute);margin-top:12px;max-width:560px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:28px;color:var(--faint);font-size:12px}
button{font:600 13px Inter;padding:10px 16px;border-radius:999px;border:1px solid rgba(212,179,106,.45);background:var(--golddim);color:var(--gold2);cursor:pointer}
button.on{background:var(--gold);color:#0b0b0d}
.todo{margin-top:18px;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--gold2);border-radius:14px;padding:14px 16px}
.todo h3{margin:0 0 8px;font:600 12px Inter;letter-spacing:.8px;text-transform:uppercase;color:var(--gold2)}
.todo ul{margin:0;padding-left:18px}.todo li{margin:6px 0;font-size:15px;line-height:1.4}
.why{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);font-size:13px}.why span{white-space:nowrap}.why b{color:var(--ink);font-weight:600}.why .wn{flex-basis:100%;white-space:normal;color:var(--amber)}
.hl{display:flex;flex-direction:column}.hr{display:grid;grid-template-columns:92px 90px 1fr;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px;align-items:center}
.hr:first-child{border-top:0}.hr small{color:var(--mute)}.tag{font-weight:600}.tag.buy{color:var(--buy)}.tag.sell{color:var(--sell)}.tag.no{color:var(--faint)}
@media(max-width:620px){.hr{grid-template-columns:80px 1fr}.hr .res{grid-column:1/-1}}
@media(max-width:620px){.kpis,.bt{grid-template-columns:repeat(2,1fr)}.lv{grid-template-columns:repeat(2,1fr)}.mname,.px .v{font-size:26px}.px{text-align:left;width:100%}}
.jt{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}.jt col.c1{width:24%}.jt col.c2{width:30%}.jt col.c3{width:24%}.jt col.c4{width:22%}.jt th{white-space:nowrap}.jt th:last-child,.jt td:last-child{text-align:right}.jt td:first-child{white-space:nowrap}.jt small{display:block;color:var(--faint);font-size:11px}
@media(max-width:620px){.jt{font-size:13px}.jt col.c1{width:27%}.jt col.c2{width:31%}.jt col.c3{width:20%}.jt col.c4{width:22%}}.jt td.jempty{text-align:center;color:var(--mute);padding:22px 6px}.jt th{color:var(--faint);font:600 10.5px Inter;letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.jt td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}.jt tr:first-child td{border-top:0}.pos{color:var(--buy)}.neg{color:var(--sell)}
.jd{cursor:pointer}.jd:hover td{background:rgba(255,255,255,.02)}.jsub td{background:var(--bg2);font-size:12.5px;color:var(--mute)}
.note{color:var(--faint);font-size:12px;margin-top:10px;line-height:1.45}
@media(max-width:620px){.jt .hide-m{display:none}}
.hrow{display:grid;grid-template-columns:34px 1.4fr 1fr 1fr 1.1fr 104px;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer}
.hrow em{font-style:normal;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 12px Inter}
.hrow.BUY em{background:var(--buydim);color:var(--buy)}.hrow.SELL em{background:var(--selldim);color:var(--sell)}
.hrow .h1 b{display:block;font-weight:700}.hrow .h1 small{color:var(--mute);font-size:11.5px}
.hrow .cx span{display:block;letter-spacing:.4px;text-transform:uppercase;font-size:10px;color:var(--faint)}.hrow .cx b{font:600 13.5px Inter}
.hrow>.st{justify-self:end}.hrow.done{opacity:.62}
.lvt{color:var(--buy);font-weight:700;letter-spacing:.6px}.ppt{color:var(--amber);font-weight:700;letter-spacing:.6px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.mrow:first-child{border-top:0}
.mrow small{font-size:11px}.mrow .mmsg{display:block;color:var(--mute);font-size:12.5px;margin-top:3px;letter-spacing:0;font-weight:400}
.mpx{text-align:right;white-space:nowrap}.mpx .pill{margin:6px 0 0;display:flex;padding:5px 10px;font-size:10.5px}
@media(max-width:620px){.hrow{grid-template-columns:1fr 1fr 1fr;row-gap:8px}.hrow em{display:none}.hrow .h1{grid-column:1/3}.hrow>.st{grid-column:3;grid-row:1}.hrow .cx{grid-row:2}}
.cwrap{margin:18px 0 4px}.cwrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tfs{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}.tfs button{padding:5px 11px;font-size:12px}
.ctag{font:600 11px Inter}.cnote{color:var(--faint);font-size:11px;margin-top:4px}
#ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:12px;transition:height .15s}
#rf{padding:6px 10px;font-size:12px;margin-left:6px;flex:none}@media(max-width:620px){.brand small{display:none}.live{font-size:11px}}
.cx small{display:block;color:var(--mute);font-size:11px;font-weight:500}
body.fs{overflow:hidden}body.fs #lwcbox{position:fixed;inset:0;z-index:50;background:var(--bg);padding:10px 12px}body.fs #lwc{height:calc(100vh - 70px)!important}
.colp{display:inline-flex;align-items:center;gap:6px;font:600 12px Inter;color:var(--gold2);border:1px solid rgba(212,179,106,.45);border-radius:999px;padding:3px 6px 3px 11px;background:var(--golddim)}.colp input{width:26px;height:22px;border:0;padding:0;background:none;cursor:pointer}.tfs{flex-wrap:wrap}
.tvov{position:absolute;top:44px;left:56px;z-index:5;display:flex;flex-direction:column;gap:4px;pointer-events:none}.ovr{background:rgba(11,11,13,.82);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;font:600 12px Inter;color:var(--ink)}.ovr.BUY b{color:var(--buy)}.ovr.SELL b{color:var(--sell)}.ovr span{color:var(--mute)}
</style></head>
<body><div id="ptr"></div><div class="wrap">
<header><div class="brand"><div class="mark"></div><div><h1>Signal Desk</h1><small>Day-trade signals</small></div></div>
<div class="live"><div class="dot"></div><div id="upd">Connecting…</div><button id="rf" aria-label="Refresh">↻ Refresh</button></div></header>
<nav class="chips" id="chips"></nav>
<main id="main"></main>
<div class="foot"><span id="src"></span><button id="snd">Sound alerts: off</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" onerror="var s=document.createElement('script');s.src='https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js';s.onload=function(){try{render()}catch(e){}};document.head.appendChild(s)"></script>
<script>
const host=location.hostname,repo=location.pathname.split('/').filter(Boolean)[0]||'gold-alerts';
const RAW=host.endsWith('github.io')?`https://raw.githubusercontent.com/${host.split('.')[0]}/${repo}/main/docs/`:'';
const DATA=RAW+'data.json',JOUR=RAW+'journal.json';
let D=null,J=null,sel=(location.hash||'').slice(1)||'HOME',seen=null,sound=false,ctx=null,openDay=null,tf=15;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=v=>v==null?'—':Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const usd=v=>v==null?'—':(v>=0?'+$':'−$')+Math.abs(v).toFixed(2);
const STATE={buy:'Buy day',sell:'Sell day',waiting:'Waiting',blocked:'First signal skipped',none:'No trade today',closed:'Market closed'};
const STL={open:'Open',stopped:'Stopped out',eod:'Closed at day end',close_now:'Close now'};
const mv=w=>w==='rose'?'Rose ↑':w==='fell'?'Fell ↓':w==='flat'?'Flat':'—';
$('snd').onclick=()=>{try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();sound=!sound;$('snd').textContent='Sound alerts: '+(sound?'on':'off');$('snd').classList.toggle('on',sound);if(sound)beep()}catch(e){}};
function beep(){if(!sound||!ctx)return;[0,.28,.56].forEach((t,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=[784,988,1319][i];o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.0001,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,ctx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t+.25);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.26)});if(navigator.vibrate)navigator.vibrate([250,120,250])}
let CH=null,CHK=null,CHR=null,PEND=null,cmode='full',showTr=true,TVK=null;
let cUp='#35c47f',cDn='#ff6464';try{cUp=localStorage.getItem('cUp')||cUp;cDn=localStorage.getItem('cDn')||cDn}catch(e){}
function setCol(u,d){cUp=u||cUp;cDn=d||cDn;try{localStorage.setItem('cUp',cUp);localStorage.setItem('cDn',cDn)}catch(e){}if(CH&&CH._se)CH._se.applyOptions({upColor:cUp,downColor:cDn,wickUpColor:cUp,wickDownColor:cDn})}
const TVSYM={GOLD:'CAPITALCOM:XAUUSD',USDJPY:'CAPITALCOM:USDJPY',OIL:'CAPITALCOM:USOIL',US100:'CAPITALCOM:NAS100',US100F:'CAPITALCOM:NAS100',SILVER:'CAPITALCOM:XAGUSD',US500:'CAPITALCOM:SPX500'};
function spark(m){if(window.LightweightCharts&&(m.spark||[]).length>=2||TVSYM[m.code]){PEND=m;
 const fsb=`<button onclick="document.body.classList.toggle('fs');this.textContent=document.body.classList.contains('fs')?'✕ Exit full screen':'⛶ Full screen';setTimeout(()=>{if(CH)CH.timeScale().fitContent()},120)">${document.body.classList.contains('fs')?'✕ Exit full screen':'⛶ Full screen'}</button>`;
 const mb=`<button class="${cmode==='desk'?'on':''}" onclick="cmode='desk';render()">Desk chart</button>${TVSYM[m.code]?`<button class="${cmode==='full'?'on':''}" onclick="cmode='full';render()">Capital.com chart</button>`:''}`;
 const H=Math.round(Math.min(680,Math.max(300,innerHeight*(innerWidth>760?.68:.55))));

function trades(){const out=[];for(const m of Object.values(D.markets)){if(!(m.live||m.paper))continue;const E=m.entries||[];
  for(const e of E){const dir=e.side==='BUY'?1:-1,run=e.status==='open'||e.status==='close_now';let res=null,txt='—',unit='';
   if(m.code==='GOLD'){res=run?(m.price==null?null:(m.price-e.price)*dir):e.pnl;txt=res==null?'—':usd(res)+' /oz'}
   else if(m.unit==='usd'){res=run?(m.price==null?null:(m.price-e.price)*dir):e.res;txt=res==null?'—':usd(res)+' /bbl'}
   else if(m.unit==='pts'){res=run?e.live:e.res;txt=pts(res)}
   else{res=run?(m.price==null?null:(m.price-e.price)*dir*100):e.pips;txt=pips(res)}
   const dp=m.dp??2;out.push({m,e,run,res,txt,t:dmin(e.time),px:Number(e.price).toFixed(m.code==='GOLD'?2:dp),st:Number(e.stop).toFixed(m.code==='GOLD'?2:dp)})}}
 return out.sort((a,b)=>(b.run-a.run)||(b.t-a.t))}
function home(){const T=trades(),run=T.filter(x=>x.run),done=T.filter(x=>!x.run);
 const line=x=>`<div class="hrow ${x.e.side} ${x.run?'':'done'} num" onclick="go('${x.m.code}')"><em>${x.e.side==='BUY'?'B':'S'}</em>
  <div class="h1"><b>${esc(x.m.name)}</b><small>${esc(x.e.time)} Dubai · <span class="${x.m.live?'lvt':'ppt'}">${x.m.live?'LIVE':'PAPER'}</span></small></div>
  <div class="cx"><span>${esc(x.e.side)} at</span><b>${x.px}</b></div><div class="cx"><span>Stop</span><b>${x.st}</b></div>
  <div class="cx"><span>${x.run?'Now '+(x.m.price==null?'':Number(x.m.price).toFixed(x.m.code==='GOLD'?2:(x.m.dp??2))):'Result'}</span><b class="${x.res==null?'':x.res>=0?'pos':'neg'}">${esc(x.txt)}</b></div>
  <span class="st st-${x.e.status==='close_now'?'close_now':x.run?'open':x.e.status}">${esc(x.e.status==='close_now'?'Close now':x.run?'Running':(STL[x.e.status]||x.e.status))}</span></div>`;
 const mk=Object.values(D.markets).map(m=>`<div class="mrow" onclick="go('${m.code}')"><div><b>${esc(m.name)}</b> <small class="${m.live?'lvt':'ppt'}">${m.live?'LIVE':m.paper?'PAPER':esc(m.status||'')}</small><small class="mmsg">${esc(m.message||m.note||'')}</small></div>
  <div class="num mpx">${m.price==null?'':Number(m.price).toFixed(m.code==='GOLD'?2:(m.dp??2))}<span class="pill s-${esc(m.state||'none')}">${esc((STATE[m.state]||m.state||m.status||'').replace(' day',''))}</span></div></div>`).join('');
 $('main').innerHTML=`<section class="card hero"><div class="htop"><div><div class="mname">Trades now</div><div class="msym">Every market · newest first · tap a trade for its market</div></div>
  <div class="px num"><div class="v">${run.length}</div><div class="c">running</div></div></div>
  <div class="ents" style="margin-top:16px">${run.map(line).join('')||'<div class="empty">No trade running right now.</div>'}</div></section>
  <div class="sec"><h2>Closed today</h2><span>${done.length} trade${done.length===1?'':'s'}</span></div>
  <div class="ents">${done.map(line).join('')||'<div class="empty">No closed trades yet today.</div>'}</div>
  <div class="sec"><h2>Markets</h2><span>Gold is live (real signals) · the others are paper tests, do not trade them</span></div>
  <section class="card" style="padding:6px 16px">${mk}</section>`}
function ovHTML(m){if(!m||!showTr)return'';const dp=m.code==='GOLD'?2:(m.dp??2),E=(m.entries||[]).filter(e=>e.status==='open'||e.status==='close_now');
 if(!E.length)return'<div class="ovr"><span>No open trade</span></div>';
 return E.map(e=>{const d=e.side==='BUY'?1:-1,now=m.price,pl=now==null?null:(now-e.price)*d;return`<div class="ovr ${e.side}"><b>${e.side}</b> ${Number(e.price).toFixed(dp)} · stop ${Number(e.stop).toFixed(dp)}${pl==null?'':` · <span class="${pl>=0?'pos':'neg'}">${pl>=0?'+':'−'}${Math.abs(pl).toFixed(dp)}</span>`}</div>`}).join('')}
function ovUpd(){const el=document.getElementById('tvov');if(!el||!D)return;const m=D.markets[sel];el.innerHTML=ovHTML(m);document.querySelectorAll('#lwcbox .tfs button').forEach(b=>{if(/our trades/.test(b.textContent)){b.textContent=(showTr?'Hide':'Show')+' our trades';b.classList.toggle('on',showTr)}})}
function mountTV(m){setTimeout(ovUpd,0);const el=document.getElementById('tvc');if(!el)return;const sym=TVSYM[m.code];
 if(TVK&&TVK.sym===sym&&TVK.node&&TVK.cu===cUp+cDn){el.appendChild(TVK.node);return}
 const node=document.createElement('div');node.id='tv_'+Date.now();node.style.height='100%';el.appendChild(node);TVK={sym,node,cu:cUp+cDn};
 const go=()=>new TradingView.widget({container_id:node.id,symbol:sym,interval:'15',timezone:'Asia/Dubai',theme:'dark',style:'1',locale:'en',autosize:true,allow_symbol_change:false,withdateranges:true,hide_side_toolbar:false,save_image:false,overrides:{'mainSeriesProperties.candleStyle.upColor':cUp,'mainSeriesProperties.candleStyle.downColor':cDn,'mainSeriesProperties.candleStyle.wickUpColor':cUp,'mainSeriesProperties.candleStyle.wickDownColor':cDn,'mainSeriesProperties.candleStyle.borderUpColor':cUp,'mainSeriesProperties.candleStyle.borderDownColor':cDn}});
 if(window.TradingView)go();else{const sc=document.createElement('script');sc.src='https://s3.tradingview.com/tv.js';sc.onload=go;document.head.appendChild(sc)}}
function mountChart(){if(document.getElementById('tvc')&&PEND){const m=PEND;PEND=null;if(CH){try{CH.remove()}catch(e){}CH=null}mountTV(m);return}
 const el=document.getElementById('lwc'),m=PEND;PEND=null;
 if(CH){try{const k=CHK;CHR=CH.timeScale().getVisibleLogicalRange();CHK=k;CH.remove()}catch(e){}CH=null}
 if(!el||!m)return;const key=m.code+'|'+tf;
 const dp=m.code==='GOLD'?2:(m.dp??(m.unit==='pts'?1:m.unit==='usd'?2:3)),s=m.spark,ohlc=s[0].length>=5;
 const day=Date.UTC(2026,0,1)/1000;let prev=-1,off=0;const raw=[];
 s.forEach((x,i)=>{let mm=dmin(x[0]);if(mm<0)return;if(mm>=1440)mm-=1440;if(prev>=0&&mm+off<prev)off+=1440;const t=mm+off;prev=t;
  const c=+x[1],o=ohlc?+x[2]:(i?+s[i-1][1]:c),h=ohlc?+x[3]:Math.max(o,c),l=ohlc?+x[4]:Math.min(o,c);raw.push({t,o,h,l,c})});
 const B=[];for(const b of raw){const k=Math.floor(b.t/tf),L=B[B.length-1];
  if(L&&L.k===k){L.high=Math.max(L.high,b.h);L.low=Math.min(L.low,b.l);L.close=b.c}else B.push({k,time:day+k*tf*60,open:b.o,high:b.h,low:b.l,close:b.c})}
 const css=getComputedStyle(document.documentElement),v=n=>css.getPropertyValue(n).trim();
 CH=LightweightCharts.createChart(el,{autoSize:true,layout:{background:{type:'solid',color:'transparent'},textColor:v('--mute'),fontFamily:'Inter,system-ui,sans-serif'},
  grid:{vertLines:{color:'rgba(255,255,255,.04)'},horzLines:{color:'rgba(255,255,255,.05)'}},
  rightPriceScale:{borderColor:v('--line')},timeScale:{borderColor:v('--line'),timeVisible:true,secondsVisible:false,rightOffset:4},
  crosshair:{mode:0},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:true},
  handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:{time:true,price:true},axisDoubleClickReset:true},
  localization:{priceFormatter:p=>Number(p).toFixed(dp),timeFormatter:t=>{const mm=((t-day)/60)%1440,h=Math.floor(mm/60),mi=mm%60;return`${(h%12)||12}:${String(mi).padStart(2,'0')} ${h<12?'am':'pm'}`}}});
 CH.timeScale().applyOptions({tickMarkFormatter:t=>{const mm=((t-day)/60)%1440,h=Math.floor(mm/60),mi=mm%60;return`${(h%12)||12}:${String(mi).padStart(2,'0')}${h<12?'a':'p'}`}});
 const se=CH.addCandlestickSeries({upColor:cUp,downColor:cDn,borderVisible:false,wickUpColor:cUp,wickDownColor:cDn,priceFormat:{type:'price',precision:dp,minMove:Math.pow(10,-dp)},autoscaleInfoProvider:o=>{const r=o();const L=(showTr?(m.entries||[]):[]).filter(e=>e.status==='open'||e.status==='close_now').flatMap(e=>[+e.price,+e.stop]);if(!r||!L.length)return r;r.priceRange.minValue=Math.min(r.priceRange.minValue,...L);r.priceRange.maxValue=Math.max(r.priceRange.maxValue,...L);return r}});
 se.setData(B.map(({k,...r})=>r));CH._se=se;
 for(const e of (showTr?(m.entries||[]):[]).filter(e=>e.status==='open'||e.status==='close_now')){const c=e.side==='BUY'?v('--buy'):v('--sell');
  se.createPriceLine({price:+e.price,color:c,lineWidth:2,lineStyle:0,axisLabelVisible:true,title:e.side+' entry'});
  se.createPriceLine({price:+e.stop,color:v('--amber'),lineWidth:2,lineStyle:2,axisLabelVisible:true,title:'stop'})}
 if(CHK===key&&CHR)CH.timeScale().setVisibleLogicalRange(CHR);else CH.timeScale().fitContent();CHK=key}
function render(){render0();try{mountChart()}catch(e){console.error(e)}}

 if(m.paper){paper(m);return}
 if(!m.live){$('main').innerHTML=`<section class="card hero info"><div class="mname">${esc(m.name)}</div><div class="pill s-blocked">${esc(m.status)}</div><p>${esc(m.note)}</p><p>Signals will appear here once this market is finished and checked at Capital.com cost.</p></section>`;return}
 const ch=m.change,chc=ch==null?'':ch>=0?'up':'dn',E=m.entries||[];
 const ents=E.map((e,i)=>row(e,i+1,m)).reverse().join('');
 $('main').innerHTML=`<section class="card hero"><div class="htop"><div><div class="mname">${esc(m.name)}</div><div class="msym">${esc(m.symbol)} · ${esc(m.version||'')} · base size ${m.size} oz</div></div>
  <div class="px num"><div class="v">${f2(m.price)}</div><div class="c ${chc}">${ch==null?'':(ch>=0?'+':'')+f2(ch)+' today'}</div></div></div>
  ${spark(m)}<div class="pill s-${m.state}">${esc(STATE[m.state]||m.state)}</div><div class="msg">${esc(m.message)}</div>${todo(m)}${why(m)}</section>
  <div class="sec"><h2>Today's trades</h2><span>${E.length} trade${E.length===1?'':'s'} · daily range ${f2(m.datr)} · stop ½ range (¾ for level breaks)</span></div>

  ${journal()}`;
}
async function load(){if(!history.state)history.replaceState({sel},'',sel==='HOME'?location.pathname:'#'+sel);try{const r=await fetch(DATA+'?t='+Date.now(),{cache:'no-store'});D=await r.json();
 try{const q=await fetch(JOUR+'?t='+Date.now(),{cache:'no-store'});J=await q.json()}catch(e){J=null}
 $('upd').innerHTML=`Updated <b style="color:var(--ink)">${esc(D.updated)}</b> Dubai`;$('src').textContent='Prices: '+D.source+' · checks every minute · page updates every 10 minutes · signals only, you place the trades';
 const key=Object.values(D.markets).map(m=>m.code+':'+(m.entries||[]).length+(m.code==='GOLD'?'|'+m.state+'|'+(m.entries||[]).map(e=>e.status).join(','):'')).join(';');const chg=seen!==null&&key!==seen;if(chg)beep();seen=key;if(sel!=='HOME'&&document.getElementById('tvc')&&!chg){ovUpd();return}render()}
 catch(e){$('upd').textContent='Waiting for data…'}}

(()=>{let y0=null,dy=0;const P=$('ptr');
 window.addEventListener('touchstart',e=>{y0=window.scrollY<=0?e.touches[0].clientY:null;dy=0},{passive:true});
 window.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0){P.style.height=Math.min(dy/2,64)+'px';P.textContent=dy>130?'Release to refresh':'Pull to refresh'}},{passive:true});
 window.addEventListener('touchend',()=>{if(y0==null)return;if(dy>130){P.style.height='44px';P.textContent='Refreshing…';load().finally(()=>{P.style.height='0'})}else P.style.height='0';y0=null},{passive:true});})();
