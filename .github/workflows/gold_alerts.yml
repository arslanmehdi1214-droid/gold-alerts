name: gold-alerts
on:
  schedule:
    - cron: '*/30 * * * 0-5'    # backup only now: starts a checking job if the self-chain below ever breaks (Sunday-Friday UTC)
  workflow_dispatch:
    inputs:
      test:
        description: 'Run a test now'
        default: 'yes'
permissions:
  contents: write
  actions: write
concurrency: gold-alerts
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Check for signals every minute
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITAL_API_PASSWORD }}
          CAPITAL_DEMO: '1'
          ALERT_SIZE_OZ: '0.1'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOP_MINUTES: '330'
        run: |
          git config user.name gold-bot; git config user.email gold-bot@users.noreply.github.com
          # a REAL manual test = workflow_dispatch with the "test" input left as "yes" (the default, unchanged behaviour).
          # a self-chained continuation (below) always passes test=no, so it runs the real loop, not a test.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.test }}" = "yes" ]; then python run.py --test; else python loop.py; fi
      - name: Save sent-alerts list
        if: always()
        run: |
          git add sent.json docs/*.json 2>/dev/null || true
          for p in autotrade_state.json autotrade_log.json docs/sp_min docs/nq_min; do git add "$p" 2>/dev/null || true; done
          git diff --cached --quiet || (git commit -m "alerts state" && (git push || (git pull --rebase -X theirs && git push)))
      - name: Start the next run now (self-chain - don't wait for the next cron tick)
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.test != 'yes')
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gold_alerts.yml/dispatches" \
            -d '{"ref":"main","inputs":{"test":"no"}}'
